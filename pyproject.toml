[project]
name = "fr3-scan2cad"
version = "0.1.0"
description = "FR3 three-finger arm: AprilTag calibration, open-vocabulary detection, IK orbit capture, TRELLIS -> metric CAD"
requires-python = ">=3.11,<3.12"
# Brain / register / video / eval environment.  Isaac Sim and TRELLIS run in their own environments.
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "ultralytics==8.4.202",       # YOLOE-26, SAM2.1, SAM3
  "opencv-python-headless==4.11.0.86",
  "numpy>=2.0",
  "scipy>=1.14",
  "trimesh>=4.5",
  "fast-simplification>=0.1",   # trimesh quadric decimation
  "pillow>=10",
  "timm",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = []
